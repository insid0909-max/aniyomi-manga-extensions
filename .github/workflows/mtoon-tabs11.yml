          fs.writeFileSync(p+'.check.js',out);cp.execFileSync(process.execPath,['--check',p+'.check.js']);fs.unlinkSync(p+'.check.js');const prefs={},ctx={MProvider:class{},SharedPreferences:class{get(k){return prefs[k];}setString(k,v){prefs[k]=v;}}};vm.createContext(ctx);vm.runInContext(out,ctx);const rule={state:'완결',day:'today',genre:'판타지'};ctx.mtApplyRule11([{type:'rule',state:1}],rule);assert.equal(ctx.mtRule11('popular').genre,'판타지');assert.equal(ctx.mtRule11('latest'),null);ctx.mtApplyRule11([{type:'rule',state:2}],rule);assert.equal(ctx.mtRule11('latest').day,'today');assert(/^[0-6]$/.test(ctx.mtOptions11(rule).day));ctx.mtApplyRule11([{type:'rule',state:5}],rule);assert.equal(ctx.mtRule11('popular'),null);assert.equal(ctx.mtRule11('latest'),null);ctx.mtRemember11('https://example.com');assert.equal(ctx.mtBase11(),'https://mtoon165.asia');ctx.mtRemember11('https://mtoon166.asia');assert.equal(ctx.mtBase11(),'https://mtoon166.asia');new vm.Script(ctx.mtListScript(1,'',ctx.mtOptions11(rule)));new vm.Script(ctx.mtReaderScript07('detail','123'));
