name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ensure permanent signing key
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          KEYSTORE_FILE="signingkey.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -alias xtoonkey -keypass "xtoon1234" \
              -keystore "$KEYSTORE_FILE" -storepass "xtoon1234" \
              -dname "CN=NewXtoon, OU=Extension, O=Aniyomi, L=Seoul, ST=Seoul, C=KR" \
              -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_FILE"
            git commit -m "chore: persist signing key [skip ci]" || true
            git push || true
          fi
          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias xtoonkey -storepass "xtoon1234" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV

      - name: Version code
        run: |
          echo "AUTO_VCODE=$((100 + $(git rev-list --count HEAD)))" >> $GITHUB_ENV

      - name: Generate app icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          S = 192 * 4                      # 4배 크게 그린 뒤 줄여서 부드럽게
          img = Image.new("RGBA", (S, S))
          px = img.load()
          c1, c2 = (92, 61, 255), (255, 74, 150)   # 보라 -> 분홍 그라데이션
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2 * S)
                  px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3)) + (255,)

          # 둥근 사각형 모양으로 자르기
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, S - 1, S - 1), radius=int(S * 0.23), fill=255)
          img.putalpha(mask)

          # 만화 컷 3개 (왼쪽 큰 컷 + 오른쪽 위/아래 컷)
          d = ImageDraw.Draw(img)
          m, g = int(S * 0.17), int(S * 0.045)      # 바깥 여백, 컷 사이 간격
          w = S - 2 * m
          colw = (w - g) // 2
          r = int(S * 0.05)
          white = (255, 255, 255, 245)
          d.rounded_rectangle((m, m, m + colw, S - m), radius=r, fill=white)
          rx = m + colw + g
          d.rounded_rectangle((rx, m, S - m, m + (S - 2 * m - g) // 2), radius=r, fill=white)
          d.rounded_rectangle((rx, m + (S - 2 * m - g) // 2 + g, S - m, S - m), radius=r, fill=white)

          # 왼쪽 컷 안에 말풍선
          bx0, by0 = m + int(colw * 0.16), m + int((S - 2 * m) * 0.14)
          bx1, by1 = m + int(colw * 0.84), m + int((S - 2 * m) * 0.46)
          d.ellipse((bx0, by0, bx1, by1), fill=(92, 61, 255, 255))
          tail = [(bx0 + int((bx1 - bx0) * 0.28), by1 - int((by1 - by0) * 0.12)),
                  (bx0 + int((bx1 - bx0) * 0.20), by1 + int(S * 0.07)),
                  (bx0 + int((bx1 - bx0) * 0.50), by1 - int((by1 - by0) * 0.02))]
          d.polygon(tail, fill=(92, 61, 255, 255))
          dot = int(S * 0.018)
          cy = (by0 + by1) // 2
          for k in (-1, 0, 1):
              cx = (bx0 + bx1) // 2 + k * int(S * 0.055)
              d.ellipse((cx - dot, cy - dot, cx + dot, cy + dot), fill=(255, 255, 255, 255))

          # 오른쪽 아래 컷에 'M' 표시
          x0, y0 = rx + int(colw * 0.2), m + (S - 2 * m - g) // 2 + g + int(S * 0.05)
          x1, y1 = S - m - int(colw * 0.2), S - m - int(S * 0.05)
          lw = int(S * 0.028)
          pts = [(x0, y1), (x0, y0), ((x0 + x1) // 2, (y0 + y1) // 2), (x1, y0), (x1, y1)]
          d.line(pts, fill=(255, 74, 150, 255), width=lw, joint="curve")

          out = img.resize((192, 192), Image.LANCZOS)
          os.makedirs("src/main/res/mipmap-xxxhdpi", exist_ok=True)
          out.save("src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          print("icon ok")
          EOF

      - name: Build
        run: |
          gradle assembleRelease --stacktrace \
            -PextVersionCode=${{ env.AUTO_VCODE }} \
            -PsigningStoreFile="$GITHUB_WORKSPACE/signingkey.jks" \
            -PsigningStorePassword="xtoon1234" \
            -PsigningKeyAlias="xtoonkey" \
            -PsigningKeyPassword="xtoon1234"

      - name: Generate repo index
        run: |
          mkdir -p repo/apk repo/icon
          python3 - << 'EOF'
          import os, glob, json, subprocess, hashlib

          repo = "repo"
          meta = {"meta": {"name": "NewXtoon Repository", "shortName": "NewXtoon",
                           "website": "https://github.com/insid0909-max",
                           "signingKeyFingerprint": os.environ.get("SIGNING_KEY", "")}}
          json.dump(meta, open(f"{repo}/repo.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)

          def source_id(name, lang, version_id=1):
              h = hashlib.md5(f"{name.lower()}/{lang}/{version_id}".encode()).digest()
              return str(int.from_bytes(h[:8], "big") & 0x7FFFFFFFFFFFFFFF)

          def key_id(key):
              h = hashlib.md5(key.encode()).digest()
              return str(int.from_bytes(h[:8], "big") & 0x7FFFFFFFFFFFFFFF)

          out = []
          for apk in glob.glob("build/outputs/apk/release/*.apk"):
              info = subprocess.check_output(["aapt", "dump", "badging", apk]).decode("utf-8", "ignore")
              pkg = vcode = vname = label = None
              icon = None
              for line in info.splitlines():
                  if line.startswith("package:"):
                      for part in line.split():
                          if part.startswith("name='"): pkg = part.split("'")[1]
                          elif part.startswith("versionCode='"): vcode = int(part.split("'")[1])
                          elif part.startswith("versionName='"): vname = part.split("'")[1]
                  elif line.startswith("application-label:"):
                      label = line.split("'")[1]
                  elif line.startswith("application-icon-"):
                      icon = line.split("'")[1]
              if not (pkg and vcode and vname):
                  continue
              apk_name = f"tachiyomi-ko.newxtoon-v{vname}.apk"
              subprocess.run(["cp", apk, f"{repo}/apk/{apk_name}"], check=True)
              icon_name = f"{pkg}.png"
              if icon:
                  with open(f"{repo}/icon/{icon_name}", "wb") as f:
                      subprocess.run(["unzip", "-p", apk, icon], stdout=f)
              display = (label or "Aniyomi: manga")
              out.append({
                  "name": display, "pkg": pkg, "apk": apk_name, "lang": "ko",
                  "code": vcode, "version": vname, "nsfw": 1,
                  "sources": [{"name": n, "lang": "ko", "id": i, "baseUrl": u} for n, i, u in [
                      ("newxtoon 웹툰", source_id("newxtoon 웹툰", "ko"), "https://newxtoon1.com"),
                      ("Goodtoon 웹툰", source_id("Goodtoon 웹툰", "ko"), "https://www.goodtoon006.com"),
                      ("짭툰", key_id("newxtoon.jjaptoon/ko/1"), "https://www.jjaptoon008.com"),
                      ("블랙툰", key_id("newxtoon.blacktoon/ko/1"), "https://blacktoon423.com"),
                  ]],
              })
          json.dump(out, open(f"{repo}/index.min.json", "w", encoding="utf-8"),
                    ensure_ascii=False, separators=(",", ":"))
          print("indexed", len(out))
          EOF
          # 앱이 직접 읽는 위치 호환용 복사본
          cp repo/apk/*.apk repo/ 2>/dev/null || true
          cp repo/icon/*.png repo/ 2>/dev/null || true

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
