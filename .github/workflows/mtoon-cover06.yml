name: Mtoon cover 06
on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: gate
        run: |
          if [ "$(git log -1 --format=%s)" = '머니툰 웹뷰 0.0.6 작품 표지 추출 준비' ]; then echo 'apply=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '22'
      - if: steps.gate.outputs.apply == 'true'
        run: |
          git fetch origin main gh-pages
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git worktree add -b mtoon-cover06 ../mtoon-cover06 origin/gh-pages
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process');const p='mangayomi/mtoon_webview_probe.js',before=fs.readFileSync(p,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'801df4addb0ec6ba38c2f69da8edc10d9f8558ec');assert.equal(fs.readFileSync('../mtoon-cover06/'+p,'utf8'),before);let out=before;
          const begin=out.indexOf('        await Promise.all(rows.slice(0,3)'),end=out.indexOf('\n        send({stage:',begin);assert(begin>=0&&end>begin);
          const probe=String.raw`        await Promise.all(rows.slice(0,3).map(async row=>{
              const c=new AbortController(),timer=setTimeout(()=>c.abort(),6000);
              try{
                  const page=await fetch('/list.php?i='+encodeURIComponent(row.id),{credentials:'same-origin',redirect:'error',signal:c.signal});
                  if(!page.ok){row.coverState='작품 페이지 HTTP '+page.status;return;}
                  const html=await page.text(),doc=new DOMParser().parseFromString(html,'text/html');
                  const im=doc.querySelector('.list_page_head img'),og=doc.querySelector('meta[property="og:image"]');
                  const vals=im?[im.getAttribute('data-src'),im.getAttribute('data-original'),im.getAttribute('src')]:[];
                  if(og)vals.push(og.getAttribute('content'));
                  let candidate='';for(const v of vals){if(!v)continue;try{const u=new URL(v,page.url||location.href);if(u.protocol==='https:'&&!/money_toon|\/ban\//i.test(u.href)){candidate=u.href;break;}}catch(_){}}
                  if(!candidate){row.coverState='작품 HTML에서 표지 미발견';row.dom='작품 이미지 '+doc.images.length+'개, 제목 '+String(doc.title||'').slice(0,80);return;}
                  row.dom=candidate.split(/[?#]/)[0];
                  const ok=await new Promise(resolve=>{const image=new Image();let ended=false;const finish=v=>{if(ended)return;ended=true;clearTimeout(t);image.onload=image.onerror=null;resolve(v);};const t=setTimeout(()=>finish(false),2500);image.onload=()=>finish(image.naturalWidth>0);image.onerror=()=>finish(false);image.src=candidate;});
                  row.coverState=ok?'작품 표지 추출·웹뷰 로드 성공':'작품 표지 추출, 웹뷰 로드 실패 또는 시간 초과';
                  if(ok)row.imageUrl=candidate;
              }catch(e){row.coverState=e&&e.name==='AbortError'?'작품 페이지 6초 초과':'작품 페이지 요청 실패';}finally{clearTimeout(timer);}
          }));`;
          out=out.slice(0,begin)+probe+out.slice(end);
          out=out.replaceAll('0.0.5','0.0.6').replaceAll('mt_cover05_','mt_cover06_').replaceAll('조합 주소:','적용 주소:');
          assert(out.includes("image:String(x.imageUrl||'').replace(/[?#].*$/,'')"));out=out.replace("image:String(x.imageUrl||'').replace(/[?#].*$/,'')","image:String(x.imageUrl||'')");
          fs.writeFileSync(p+'.check.js',out);cp.execFileSync(process.execPath,['--check',p+'.check.js']);fs.unlinkSync(p+'.check.js');const ip='../mtoon-cover06/mangayomi/index.json',index=JSON.parse(fs.readFileSync(ip,'utf8')),rows=index.filter(x=>x.id===870214020);assert.equal(rows.length,1);assert.equal(rows[0].version,'0.0.5');rows[0].version='0.0.6';fs.writeFileSync(p,out);fs.writeFileSync('../mtoon-cover06/'+p,out);fs.writeFileSync(ip,JSON.stringify(index,null,1)+'\n');
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add mangayomi/mtoon_webview_probe.js
          git diff --cached --check
          git commit -m '머니툰 웹뷰 0.0.6 작품 페이지 표지 추출 [skip ci]'
          git -C ../mtoon-cover06 add mangayomi/mtoon_webview_probe.js mangayomi/index.json
          git -C ../mtoon-cover06 diff --cached --check
          git -C ../mtoon-cover06 commit -m '머니툰 웹뷰 시험 0.0.6 배포 [skip ci]'
          git push --atomic origin HEAD:main mtoon-cover06:gh-pages
