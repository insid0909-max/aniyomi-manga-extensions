name: 머니툰 임시 오류 진단판 적용
on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mtoon-diagnostic-once
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: 승인한 준비 커밋에서만 실행
        id: gate
        run: |
          if [ "$(git log -1 --format=%s)" = "머니툰 0.1.21 임시 진단 준비" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '22'
      - name: 현재 배포 브랜치 별도 준비
        if: steps.gate.outputs.apply == 'true'
        run: |
          git fetch origin gh-pages
          git worktree add -b mtoon-diag-publish "$RUNNER_TEMP/mtoon-diag-pages" FETCH_HEAD
          echo "MT_PAGES=$RUNNER_TEMP/mtoon-diag-pages" >> "$GITHUB_ENV"
      - name: 원본 보존·진단 정보 가림 검사와 최소 수정
        if: steps.gate.outputs.apply == 'true'
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const vm=require('node:vm'),assert=require('node:assert/strict');
          async function verify(before,after,helper){const p={};vm.createContext(p);vm.runInContext(helper+';globalThis.diag=mtoonDiagnostic;',p);const url='https://mtoon165.asia/more.php?search=PRIVATE_TITLE&token=PRIVATE_TOKEN',err=Object.assign(new Error('timeout https://mtoon165.asia/more.php?token=PRIVATE_TOKEN\nCookie: PRIVATE_COOKIE\nAuthorization: PRIVATE_AUTH'),{statusCode:403}),msg=p.diag(err,url,Date.now()-1000);for(const s of ['PRIVATE_TITLE','PRIVATE_TOKEN','PRIVATE_COOKIE','PRIVATE_AUTH'])assert(!msg.includes(s));assert(msg.includes('GET https://mtoon165.asia/more.php'));assert(msg.includes('HTTP 상태: 403'));assert(msg.includes('timeout'));assert(p.diag(new ReferenceError('setTimeout is not defined'),url,Date.now()).includes('ReferenceError'));assert(p.diag(Error('시간 초과'),url,Date.now()).includes('HTTP 상태: 미확인'));const extract=s=>{const i=s.indexOf('    async listPage(url) {'),j=s.indexOf('\n    }',i);assert(i>=0&&j>i);return s.slice(i,j+6)};async function run(s,error,response){const calls=[],c={Date,BLOCK_HELP:'사이트에 연결되지 않아요.',CF_HELP:'보안 확인 안내',CF_PAGE:/Just a moment|cf-chl/i,friendlyHttp:n=>'HTTP '+n,limitedGet:async(raw,u,h,ms)=>{calls.push({u,h,ms});if(error)throw error;return response}};vm.createContext(c);vm.runInContext(helper+'\nclass Test{'+extract(s)+'};globalThis.Test=Test;',c);const x=new c.Test();x.raw={};x.hdr=()=>({'User-Agent':'fixture',Referer:'https://mtoon165.asia/'});x.listJson=()=>({list:[{name:'작품',imageUrl:'cover',link:'item'}],hasNextPage:false});x.warmCovers=async()=>{};try{return {result:await x.listPage(url),calls}}catch(e){return {error:e.message,calls}}}const a=await run(before,null,{statusCode:200,body:'[]'}),b=await run(after,null,{statusCode:200,body:'[]'});assert.equal(JSON.stringify(a),JSON.stringify(b));assert.equal(b.calls.length,1);assert.equal(b.calls[0].ms,20000);assert.equal((await run(before,Error('시간 초과'))).error,'사이트에 연결되지 않아요.');const failed=await run(after,new ReferenceError('setTimeout is not defined'));assert(failed.error.includes('setTimeout is not defined'));assert(failed.error.includes('[MT 0.1.21 임시 진단]'));assert(!failed.error.includes('PRIVATE_TITLE'));assert.equal((await run(after,null,{statusCode:403,body:'<title>Just a moment...</title>'})).error,'보안 확인 안내');console.log('성공 경로·요청/20초 제한 보존·원래 오류·정보 가림·보안 안내 검사 통과')}

          (async()=>{const file='mangayomi/mtoon.js',before=fs.readFileSync(file,'utf8'),hash=s=>{const b=Buffer.from(s);return crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex')},expected='76d8750df225b63ec733023d14cab10161a0c005',pages=process.env.MT_PAGES;assert(pages);assert.equal(hash(before),expected,'원본 변경·재검토 필요');assert.equal(hash(fs.readFileSync(pages+'/'+file,'utf8')),expected,'배포 원본 변경·재검토 필요');const helper="function mtDiagText(v,max){try{return String(v==null?'':v).replace(/https?:\\/\\/[^\\s\"'<>)]*/gi,u=>{const m=/^(https?:\\/\\/)(?:[^/@]+@)?([^/?#]+)/i.exec(u);return m?m[1]+m[2]+'/[주소 생략]':'[주소 숨김]'}).replace(/[\"']?(?:authorization|cookie|set-cookie)[\"']?\\s*[:=]\\s*[^\\r\\n]*/gi,'[인증 정보 숨김]').replace(/[\"']?(?:access_token|refresh_token|token|password|passwd|session|sessionid|sid|signature|sig|search)[\"']?\\s*[:=]\\s*(?:\"[^\"]*\"|'[^']*'|[^\\s,;]+)/gi,'[민감 값 숨김]').replace(/\\s+/g,' ').trim().slice(0,max)}catch(_){return '표시 불가'}}\nfunction mtoonDiagnostic(e,url,startedAt){try{const request=String(url||'').replace(/[?#].*$/,'').replace(/^(https?:\\/\\/)[^/@]+@/i,'$1[숨김]@').slice(0,100),kind=mtDiagText(e&&e.name||'Error',32),message=mtDiagText(e&&e.message||e,160),code=Number(e&&(e.statusCode||(e.response&&e.response.statusCode))),elapsed=Math.max(0,Date.now()-Number(startedAt));return '[MT 0.1.21 임시 진단]\\n요청: GET '+request+'\\n경과: '+(Number.isFinite(elapsed)?(elapsed/1000).toFixed(1):'?')+'초 · 종류: '+kind+'\\nHTTP 상태: '+(code>=100&&code<=599?code:'미확인')+'\\n원래 오류: '+message}catch(_){return '[MT 0.1.21 임시 진단] 원래 오류를 표시하지 못했습니다.'}}\n",oldHelp="const BLOCK_HELP = \"사이트에 연결되지 않아요. 이 앱의 연결 방식으로는 이 사이트 접속이 막혀 있어요 (응답 없음).\";",newHelp="const BLOCK_HELP = \"사이트에 연결되지 않아요. 목록 요청이 실패했어요. 아래 진단으로 원인을 확인해 주세요.\";",oldStart="    async listPage(url) {",newStart="    async listPage(url) {\n        const mtDiagStartedAt = Date.now();",oldThrow="throw new Error(BLOCK_HELP);",newThrow="throw new Error(BLOCK_HELP + \"\\n\" + mtoonDiagnostic(e, url, mtDiagStartedAt));",cls='class DefaultExtension extends MProvider {',oldVersion='"version": "0.1.20"',newVersion='"version": "0.1.21"';for(const needle of [oldHelp,oldStart,oldThrow,cls,oldVersion])assert.equal(before.split(needle).length,2,'수정 위치 불일치');const after=before.replace(cls,()=>helper+cls).replace(oldHelp,newHelp).replace(oldStart,newStart).replace(oldThrow,newThrow).replace(oldVersion,newVersion),mask=s=>s.replace(helper,'').replace(newHelp,oldHelp).replace(newStart,oldStart).replace(newThrow,oldThrow).replace(newVersion,oldVersion);assert.equal(mask(before),mask(after),'진단 표시 외 변경 금지');await verify(before,after,helper);const tmp=file+'.check.js';fs.writeFileSync(tmp,after);try{cp.execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'})}finally{fs.unlinkSync(tmp)}const indexFile=pages+'/mangayomi/index.json',index=JSON.parse(fs.readFileSync(indexFile,'utf8')),others=JSON.stringify(index.filter(x=>x.id!==870214019)),row=index.find(x=>x.id===870214019);assert(row&&row.version==='0.1.20');row.version='0.1.21';assert.equal(JSON.stringify(index.filter(x=>x.id!==870214019)),others);const notes=JSON.parse(fs.readFileSync('changelog.json','utf8'));assert(Array.isArray(notes.items?.mtoon));notes.items.mtoon.unshift({d:'2026-11-09',t:'망가요미: [임시 진단] 목록 실패의 실제 GET 주소·경과·오류 종류·원래 메시지 표시. 검색어·인증 정보는 가림. 통신·우회·순정 성공 경로는 변경하지 않음. 원인 확인 후 제거.'});fs.writeFileSync(file,after);fs.writeFileSync('changelog.json',JSON.stringify(notes,null,1)+'\n');fs.writeFileSync(pages+'/'+file,after);fs.writeFileSync(indexFile,JSON.stringify(index,null,1)+'\n');console.log('머니툰 0.1.21 진단판 준비·기존 요청과 타임아웃 유지')})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node --check mangayomi/mtoon.js
          node monitor/changelog.js changelog.json 업데이트내역.md
      - name: 원본과 머니툰 배포 파일을 함께 반영
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- mangayomi/mtoon.js changelog.json 업데이트내역.md
          git diff --cached --check
          git commit -m "머니툰 0.1.21 원래 목록 오류 임시 표시 [skip ci]"
          git -C "$MT_PAGES" add -- mangayomi/mtoon.js mangayomi/index.json
          git -C "$MT_PAGES" diff --cached --check
          git -C "$MT_PAGES" commit -m "머니툰 0.1.21 임시 진단판 배포 [skip ci]"
          test "$(git log -1 --format=%ae)" = "266083559+insid0909-max@users.noreply.github.com"
          test "$(git log -1 --format=%ce)" = "266083559+insid0909-max@users.noreply.github.com"
          test "$(git -C "$MT_PAGES" log -1 --format=%ae)" = "266083559+insid0909-max@users.noreply.github.com"
          test "$(git -C "$MT_PAGES" log -1 --format=%ce)" = "266083559+insid0909-max@users.noreply.github.com"
          git push --atomic origin HEAD:main mtoon-diag-publish:gh-pages
