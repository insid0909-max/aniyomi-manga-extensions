name: 머니툰 진단 내용을 맨 앞 한 줄로 표시
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/mtoon-diagnostic-once.yml']
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 원본과 실제 배포 브랜치 준비
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          git checkout -B main origin/main
          git worktree add --detach ../mtoon-publish origin/gh-pages
      - name: 원인 우선 표시와 짧게 표시되는 화면 조건 검사
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const vm=require('node:vm'),assert=require('node:assert/strict');
          function verify(helper,formatter){const c={Date:class extends Date{static now(){return 20000}}};vm.createContext(c);vm.runInContext(helper+'\n'+formatter+';globalThis.f=mtoonDiagnostic;',c);const cases=[{name:'Error',message:'시간 초과'},{name:'ReferenceError',message:'setTimeout is not defined'},{name:'SocketException',message:'connection reset'},{name:'HttpException',message:'HTTP 403',statusCode:403},{name:'Error',message:'Authorization: Bearer SECRET\nCookie: SECRET'},{name:'Error',message:'search=SECRET token=SECRET https://mtoon165.asia/more.php?search=SECRET'},null,{name:'Error',message:'x'.repeat(400)}];for(const e of cases){const s=c.f(e,'https://mtoon165.asia/more.php?search=SECRET',0);assert(s.startsWith('[MT 0.1.22] '));assert(!s.includes('\n'));assert(!s.includes('SECRET'));assert(s.length<300);if(e&&e.name)assert(s.indexOf(e.name)<40)}const s=c.f(cases[1],'https://mtoon165.asia/more.php',0),display=('Error: '+s+'\n일반 안내').split('\n').slice(0,3).join('\n').slice(0,130);assert(display.includes('ReferenceError'));assert(display.includes('setTimeout is not defined'));assert(c.f(cases[0],'https://mtoon165.asia/more.php',0).indexOf('시간 초과')<40);assert(c.f(cases[3],'https://mtoon165.asia/more.php',0).includes('HTTP 403'));console.log('오류 종류·원래 내용 우선 표시, 줄바꿈/길이·민감값 가림 검사 통과')}

          const file='mangayomi/mtoon.js',publish='../mtoon-publish',before=fs.readFileSync(file,'utf8'),hash=s=>{const b=Buffer.from(s);return crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex')};assert.equal(hash(before),'cd2bfec80e70c9d8333d69f7b5276b79990e9052','원본이 바뀌어 재검토가 필요합니다.');assert.equal(hash(fs.readFileSync(publish+'/'+file,'utf8')),hash(before),'원본과 배포본 불일치');const pattern=/^function mtoonDiagnostic\(e,url,startedAt\)\{[^\n]*\}$/m,old=before.match(pattern)?.[0],helper=/^function mtDiagText\(v,max\)\{[^\n]*\}$/m.exec(before)?.[0],next="function mtoonDiagnostic(e,url,startedAt){try{const kind=mtDiagText(e&&e.name||'Error',24),message=mtDiagText(e&&e.message||e,96)||'원래 오류 없음',code=Number(e&&(e.statusCode||(e.response&&e.response.statusCode))),elapsed=Math.max(0,Date.now()-Number(startedAt)),request=String(url||'').replace(/[?#].*$/,'').replace(/^(https?:\\/\\/)[^/@]+@/i,'$1[숨김]@').slice(0,100);return '[MT 0.1.22] '+kind+': '+message+' · '+(Number.isFinite(elapsed)?(elapsed/1000).toFixed(1):'?')+'초 · HTTP '+(code>=100&&code<=599?code:'미확인')+' · GET '+request}catch(_){return '[MT 0.1.22] 진단 표시 실패'}}",from="throw new Error(BLOCK_HELP + \"\\n\" + mtoonDiagnostic(e, url, mtDiagStartedAt));",to="throw new Error(mtoonDiagnostic(e, url, mtDiagStartedAt) + \"\\n\" + BLOCK_HELP);";assert(old&&helper);assert.equal(before.split(from).length,2,'오류 표시 위치 불일치');verify(helper,next);const after=before.replace(pattern,()=>next).replace(from,()=>to).replace(/"version"\s*:\s*"0\.1\.21"/,'"version": "0.1.22"'),mask=s=>s.replace(pattern,()=>old).replace(to,()=>from).replace(/"version"\s*:\s*"0\.1\.(?:21|22)"/,'VERSION');assert.equal(mask(before),mask(after),'진단 표시와 버전 외 변경 금지');const tmp=file+'.check.js';fs.writeFileSync(tmp,after);try{cp.execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'})}finally{fs.unlinkSync(tmp)}const index=JSON.parse(fs.readFileSync(publish+'/mangayomi/index.json','utf8')),others=JSON.stringify(index.filter(x=>x.id!==870214019)),row=index.find(x=>x.id===870214019);assert(row&&row.version==='0.1.21');row.version='0.1.22';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/aniyomi-manga-extensions/gh-pages/mangayomi/mtoon.js?v=0.1.22';assert.equal(JSON.stringify(index.filter(x=>x.id!==870214019)),others);const notes=JSON.parse(fs.readFileSync('changelog.json','utf8')),{addNote,render}=require('./monitor/changelog.js');addNote(notes,'mtoon','2026-11-09','망가요미 0.1.22 [임시 진단]: 실제 오류 종류와 원래 내용을 맨 앞 한 줄로 표시. 주소·일반 안내는 뒤로 이동해 화면에서 원인이 안 보이던 점 보완. 기존 민감값 가림·통신·목록·회차 처리 유지. 원인 해결판은 아님.');fs.writeFileSync(file,after);fs.writeFileSync('changelog.json',JSON.stringify(notes,null,1)+'\n');fs.writeFileSync('업데이트내역.md',render(notes));fs.writeFileSync(publish+'/'+file,after);fs.writeFileSync(publish+'/mangayomi/index.json',JSON.stringify(index,null,1)+'\n');console.log('머니툰 0.1.22 오류 내용 우선 표시 준비 완료');
          NODE
      - name: 원본·배포본을 함께 반영
        run: |
          node --check mangayomi/mtoon.js
          node --check ../mtoon-publish/mangayomi/mtoon.js
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- mangayomi/mtoon.js changelog.json 업데이트내역.md
          git diff --cached --check
          git commit -m "머니툰 0.1.22 원래 오류를 맨 앞 한 줄로 표시"
          git -C ../mtoon-publish add -- mangayomi/mtoon.js mangayomi/index.json
          git -C ../mtoon-publish diff --cached --check
          git -C ../mtoon-publish commit -m "머니툰 0.1.22 진단 표시 수정판 배포"
          PUBLISH_SHA=$(git -C ../mtoon-publish rev-parse HEAD)
          git push --atomic origin HEAD:refs/heads/main "$PUBLISH_SHA":refs/heads/gh-pages
