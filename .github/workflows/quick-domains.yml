name: Quick domains

# 30분마다 주소 목록(domains.json)의 주소를 두드려, 옛 주소가 같은 이름·더 큰 번호의 주소로 넘겨 주면
# domains.json 을 바로 고침 (2026-11-13, 애니 저장소 combined-index 와 같은 monitor/quickdomains.js)
# → 확장이 접속 안 될 때 맨 먼저 이 목록을 보므로 스스로 옮겨 감. 이 작업의 푸시는 GITHUB_TOKEN 이라 빌드는 돌지 않음.
on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: quick-domains
  cancel-in-progress: false

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 매일 점검이 늦어지면 대신 시작
        # GitHub 가 08:41(한국) 예약 점검을 매일 3~5시간씩 늦게 돌림 → 09:30 까지 오늘 점검이 안 돌았으면 여기서 시작 (2026-11-14)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(TZ=Asia/Seoul date +%H%M)
          if [ "$NOW" -lt 0930 ]; then echo "아직 09:30 전 ($NOW)"; exit 0; fi
          SINCE=$(date -u -d "$(TZ=Asia/Seoul date +%F) 08:41 +0900" +%Y-%m-%dT%H:%M:%SZ)
          LAST=$(gh run list -R "$GITHUB_REPOSITORY" --workflow monitor.yml -L 1 --json createdAt -q ".[0].createdAt" 2>/dev/null || true)
          echo "오늘 예약 $SINCE · 마지막 점검 시작 ${LAST:-없음}"
          if [ -z "$LAST" ] || [[ "$LAST" < "$SINCE" ]]; then
            gh workflow run monitor.yml -R "$GITHUB_REPOSITORY" --ref main && echo "오늘 점검을 대신 시작함" || echo "시작 실패 (다음 차례에 다시)"
          fi

      - name: Quick domain check
        run: |
          OUT=$(node monitor/quickdomains.js domains.json monitor/config.json changelog.json 업데이트내역.md monitor/changelog.js) || true
          echo "$OUT"
          if echo "$OUT" | grep -q CHANGED; then
            git config user.name "insid0909-max"
            git config user.email "266083559+insid0909-max@users.noreply.github.com"
            git add domains.json changelog.json 업데이트내역.md
            git commit -q -m "사이트 주소 자동 갱신 (30분 확인): $(echo "$OUT" | grep '^바꿈' | sed 's/^바꿈 //' | tr '\n' ' ')"
            git pull -q --rebase origin main || true
            git push -q origin HEAD:main || echo "푸시 실패 (다음 차례에 다시)"
          fi
