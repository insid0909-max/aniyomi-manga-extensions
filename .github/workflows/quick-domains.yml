name: Quick domains

# 30분마다 주소 목록(domains.json)의 주소를 두드려, 옛 주소가 같은 이름·더 큰 번호의 주소로 넘겨 주면
# domains.json 을 바로 고침 (2026-11-13, 애니 저장소 combined-index 와 같은 monitor/quickdomains.js)
# → 확장이 접속 안 될 때 맨 먼저 이 목록을 보므로 스스로 옮겨 감. 이 작업의 푸시는 GITHUB_TOKEN 이라 빌드는 돌지 않음.
on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-domains
  cancel-in-progress: false

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Quick domain check
        run: |
          OUT=$(node monitor/quickdomains.js domains.json monitor/config.json changelog.json 업데이트내역.md monitor/changelog.js) || true
          echo "$OUT"
          if echo "$OUT" | grep -q CHANGED; then
            git config user.name "insid0909-max"
            git config user.email "266083559+insid0909-max@users.noreply.github.com"
            git add domains.json changelog.json 업데이트내역.md
            git commit -q -m "사이트 주소 자동 갱신 (30분 확인): $(echo "$OUT" | grep '^바꿈' | sed 's/^바꿈 //' | tr '\n' ' ')"
            git pull -q --rebase origin main || true
            git push -q origin HEAD:main || echo "푸시 실패 (다음 차례에 다시)"
          fi
