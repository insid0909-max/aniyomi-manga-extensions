name: Mtoon connect once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mtoon-connect-once.yml']
permissions:
  contents: write
concurrency:
  group: mtoon-connect-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.event.head_commit.message == '머니툰 0.1.23 목록 대체 통신 연결 준비'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git fetch origin gh-pages
          git worktree add -b mtoon-connect-publish ../mtoon-pages FETCH_HEAD
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const path='mangayomi/mtoon.js',src=fs.readFileSync(path,'utf8'),pages='../mtoon-pages/',expected='1e8081bd7487af4e537898500582ab81ef50a6b4';
          const hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');
          assert.equal(hash(src),expected,'main changed: stop');assert.equal(hash(fs.readFileSync(pages+path,'utf8')),expected,'pages changed: stop');
          const start=src.indexOf('async function limitedGet(c, url, headers, ms) {'),end=src.indexOf('\n}',start)+2;assert(start>=0&&end>start);
          const old=src.slice(start,end);assert(old.includes('Promise.race([c.get(url, headers), limit])'));
          let out=src.slice(0,start)+'async function limitedGet(c, url, headers, ms) {\n    return timedClient(c, ms).get(url, headers);\n}'+src.slice(end);
          const swap=(a,b)=>{assert.equal(out.split(a).length,2,'unexpected patch location');out=out.replace(a,b)};
          swap('            const cl = w.client();\n            if (!cl) continue;\n            try {','            try {\n                const cl = w.client();\n                if (!cl) { tried.push(`${w.name} 초기화 실패 또는 미지원`); continue; }');
          swap('tried.push(`${w.name} ${e && e.mtTimeout ? Math.round(w.wait / 1000) + "초" : "실패"}`);','tried.push(`${w.name} ${e && e.mtTimeout ? Math.round(w.wait / 1000) + "초 시간 초과" : "요청 실패"}`);');
          swap('"version": "0.1.22"','"version": "0.1.23"');
          const a=out.indexOf('async function limitedGet('),b=out.indexOf('\n// Cloudflare',a);assert(b>a);
          async function test(mode){const calls=[],ctx={MT_WAY:0,Promise,Date,Math,Error,setTimeout:(f)=>setTimeout(f,1),clearTimeout,Client:class{constructor(o){this.o=o;if(mode==='unsupported'&&!o.useDartHttpClient)throw Error('unsupported')}get(){calls.push(this.o.useDartHttpClient?'Dart':'별도');return Promise.resolve({statusCode:200,body:'dart'})}}};vm.createContext(ctx);vm.runInContext(out.slice(a,b)+';globalThis.run=limitedGet;',ctx);const raw={get:()=>{calls.push('기본');return mode==='primary'?Promise.resolve({statusCode:200,body:'primary'}):new Promise(()=>{})}};const r=await ctx.run(raw,'https://example.invalid/',{},20000);assert.equal(r.body,mode==='primary'?'primary':'dart');assert.deepEqual(calls,mode==='primary'?['기본']:['기본','Dart']);}
          (async()=>{await test('primary');await test('unsupported');fs.writeFileSync(path+'.check.js',out);require('node:child_process').execFileSync(process.execPath,['--check',path+'.check.js']);fs.unlinkSync(path+'.check.js');const ip=pages+'mangayomi/index.json',index=JSON.parse(fs.readFileSync(ip,'utf8')),rows=index.filter(x=>x.id===870214019);assert.equal(rows.length,1);assert.equal(rows[0].version,'0.1.22');rows[0].version='0.1.23';fs.writeFileSync(path,out);fs.writeFileSync(pages+path,out);fs.writeFileSync(ip,JSON.stringify(index,null,1)+'\n');console.log('Actual wrapper/factory mock checks and syntax passed; Glitch device untested');})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add mangayomi/mtoon.js
          git diff --cached --check
          git commit -m '머니툰 0.1.23 목록 요청 대체 통신 연결 [skip ci]'
          git -C ../mtoon-pages add mangayomi/mtoon.js mangayomi/index.json
          git -C ../mtoon-pages diff --cached --check
          git -C ../mtoon-pages commit -m '머니툰 0.1.23 배포 [skip ci]'
          git push --atomic origin HEAD:main mtoon-connect-publish:gh-pages
