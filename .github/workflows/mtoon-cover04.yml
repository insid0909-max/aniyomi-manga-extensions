name: Mtoon cover 04
on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: gate
        run: |
          if [ "$(git log -1 --format=%s)" = '머니툰 웹뷰 0.0.4 표지 시험 준비' ]; then echo 'apply=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '22'
      - if: steps.gate.outputs.apply == 'true'
        run: |
          git fetch origin main gh-pages
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git worktree add -b mtoon-cover04 ../mtoon-cover04 origin/gh-pages
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process');
          const p='mangayomi/mtoon_webview_probe.js',before=fs.readFileSync(p,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'75c38feaeebda4eed4d751f574fe5652095f935e');assert.equal(fs.readFileSync('../mtoon-cover04/'+p,'utf8'),before);
          let out=before;function swap(a,b){assert.equal(out.split(a).length,2,'patch location changed');out=out.replace(a,b);}
          swap('let MT_WV_PENDING = null;','let MT_WV_PENDING = null;\nconst MT_COVERS = {};');
          swap("        send({stage:'ok',origin:location.origin,status:r.status,count:data.length,rows:rows});","        await Promise.all(rows.slice(0,3).map(row=>new Promise(resolve=>{if(!row.imageUrl){row.coverState='주소 없음';resolve();return;}const img=new Image();let ended=false;const finish=s=>{if(ended)return;ended=true;clearTimeout(t);row.coverState=s;img.onload=img.onerror=null;resolve();};const t=setTimeout(()=>finish('웹뷰 표지 5초 초과'),5000);img.onload=()=>finish('웹뷰 성공 '+img.naturalWidth+'x'+img.naturalHeight);img.onerror=()=>finish('웹뷰 표지 실패');img.src=row.imageUrl;})));\n        send({stage:'ok',origin:location.origin,status:r.status,count:data.length,rows:rows});");
          swap('[mtListScript()],12)','[mtListScript()],20)');swap('16000);','24000);');swap('웹뷰 전체 16초 초과','웹뷰 전체 24초 초과');
          swap("    return {list:list,hasNextPage:false};","    data.rows.forEach(x=>{if(x&&/^\\d+$/.test(String(x.id)))MT_COVERS[data.origin+'/list.php?i='+x.id]={image:String(x.imageUrl||'').replace(/[?#].*$/,''),state:x.coverState||'웹뷰 표지 미검사 (첫 3개만 검사)'};});\n    return {list:list,hasNextPage:false};");
          swap("    async getDetail(url){throw new Error('목록 시험 성공 후 작품 상세·회차를 연결할 예정입니다.');}","    async getDetail(url){const c=MT_COVERS[String(url)]||{};throw new Error('표지시험 0.0.4 | '+(c.state||'목록을 먼저 열어 주세요')+' | '+(c.image||'표지 주소 없음'));}");
          out=out.replaceAll('0.0.3','0.0.4');fs.writeFileSync(p+'.check.js',out);cp.execFileSync(process.execPath,['--check',p+'.check.js']);fs.unlinkSync(p+'.check.js');
          const ip='../mtoon-cover04/mangayomi/index.json',index=JSON.parse(fs.readFileSync(ip,'utf8')),rows=index.filter(x=>x.id===870214020);assert.equal(rows.length,1);assert.equal(rows[0].version,'0.0.3');rows[0].version='0.0.4';fs.writeFileSync(p,out);fs.writeFileSync('../mtoon-cover04/'+p,out);fs.writeFileSync(ip,JSON.stringify(index,null,1)+'\n');
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add mangayomi/mtoon_webview_probe.js
          git diff --cached --check
          git commit -m '머니툰 웹뷰 0.0.4 첫 세 표지 진단 [skip ci]'
          git -C ../mtoon-cover04 add mangayomi/mtoon_webview_probe.js mangayomi/index.json
          git -C ../mtoon-cover04 diff --cached --check
          git -C ../mtoon-cover04 commit -m '머니툰 웹뷰 시험 0.0.4 배포 [skip ci]'
          git push --atomic origin HEAD:main mtoon-cover04:gh-pages
