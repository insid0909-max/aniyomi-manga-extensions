name: Mtoon meta 10
on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: gate
        run: |
          if [ "$(git log -1 --format=%s)" = '머니툰 웹뷰 0.0.10 작품 정보 준비' ]; then echo 'apply=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: '22'
      - if: steps.gate.outputs.apply == 'true'
        run: |
          git fetch origin main gh-pages
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git worktree add -b mtoon-meta10 ../mtoon-meta10 origin/gh-pages
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process'),vm=require('node:vm');const p='mangayomi/mtoon_webview_probe.js',before=fs.readFileSync(p,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'41f80f1f299472ad6049cdab8a7e58602d2d35ac');assert.equal(fs.readFileSync('../mtoon-meta10/'+p,'utf8'),before);let out=before;function swap(a,b){assert.equal(out.split(a).length,2,a);out=out.replace(a,b);}
          swap('imageUrl:image,raw:','imageUrl:image,meta:{author:String(x.wt_author||\'\').trim(),genre:String(x.wt_genre||\'\').trim(),description:new DOMParser().parseFromString(String(x.wt_intro||\'\'),\'text/html\').body.textContent.trim(),state:String(x.wt_fin||\'\').trim()},raw:');
          swap("const c={name:String(x.name||''),image:","const c={meta:x.meta||null,name:String(x.name||''),image:");
          out=out.replaceAll('mt_cover07_','mt_meta10_');
          swap("    async getDetail(url){return await mtRead07(url,'detail');}","    async getDetail(url){return await mtDetail10(url);}");
          const dateFn=String.raw`function mtDate10(t,now){
              t=String(t||'').trim();const day=86400000,n=now==null?Date.now():Number(now),mid=Math.floor((n+32400000)/day)*day-32400000;let m;
              if(/^오늘/.test(t)||/\d+\s*(시간|분|초)\s*전/.test(t))return String(mid);
              if(/^어제/.test(t))return String(mid-day);
              if((m=/^(\d+)\s*일\s*전/.exec(t)))return String(mid-Number(m[1])*day);
              if((m=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(t))){const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]),u=Date.UTC(y,mo-1,d),v=new Date(u);if(v.getUTCFullYear()===y&&v.getUTCMonth()===mo-1&&v.getUTCDate()===d)return String(u-32400000);}
              return null;
          }`;
          swap("    const run=()=>{",'    '+dateFn+'\n    const run=()=>{');
          swap('chapters.push({name:name,url:link});',"chapters.push({name:name,url:link,dateUpload:mtDate10(String(((a.closest('li')&&a.closest('li').querySelector('.l_d_d'))||{}).textContent||''))});");
          out+=String.raw`
          async function mtDetail10(url){
              const detail=await mtRead07(url,'detail'),id=(/[?&]i=(\d+)/.exec(String(url))||[])[1];let saved=MT_COVERS[id];
              if(!saved){try{saved=JSON.parse(new SharedPreferences().get('mt_meta10_'+id)||'null');}catch(_){}}
              const m=saved&&saved.meta;if(!m)return detail;
              if(m.author)detail.author=String(m.author);
              if(m.genre)detail.genre=String(m.genre).split(/[,|/]+/).map(x=>x.trim()).filter(Boolean);
              if(!detail.description&&m.description)detail.description=String(m.description);
              detail.status=m.state==='완결'?1:m.state==='연재중'||m.state==='연재'?0:5;
              return detail;
          }
          `;out=out.replaceAll('0.0.9','0.0.10');
          fs.writeFileSync(p+'.check.js',out);cp.execFileSync(process.execPath,['--check',p+'.check.js']);fs.unlinkSync(p+'.check.js');const ctx={MProvider:class{}};vm.createContext(ctx);vm.runInContext(out,ctx);vm.runInContext(dateFn,ctx);const now=Date.UTC(2026,10,9,1);assert.equal(ctx.mtDate10('오늘',now),String(Date.UTC(2026,10,8,15)));assert.equal(ctx.mtDate10('어제',now),String(Date.UTC(2026,10,7,15)));assert.equal(ctx.mtDate10('2일 전',now),String(Date.UTC(2026,10,6,15)));assert.equal(ctx.mtDate10('2026-11-09',now),String(Date.UTC(2026,10,8,15)));assert.equal(ctx.mtDate10('2026-02-30',now),null);assert.equal(ctx.mtDate10('',now),null);new vm.Script(ctx.mtReaderScript07('detail','123'));new vm.Script(ctx.mtListScript(1,'',null));
          const ip='../mtoon-meta10/mangayomi/index.json',index=JSON.parse(fs.readFileSync(ip,'utf8')),rows=index.filter(x=>x.id===870214020);assert.equal(rows.length,1);assert.equal(rows[0].version,'0.0.9');rows[0].version='0.0.10';fs.writeFileSync(p,out);fs.writeFileSync('../mtoon-meta10/'+p,out);fs.writeFileSync(ip,JSON.stringify(index,null,1)+'\n');
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add mangayomi/mtoon_webview_probe.js
          git diff --cached --check
          git commit -m '머니툰 웹뷰 0.0.10 작품 정보와 회차 날짜 [skip ci]'
          git -C ../mtoon-meta10 add mangayomi/mtoon_webview_probe.js mangayomi/index.json
          git -C ../mtoon-meta10 diff --cached --check
          git -C ../mtoon-meta10 commit -m '머니툰 웹뷰 시험 0.0.10 배포 [skip ci]'
          git push --atomic origin HEAD:main mtoon-meta10:gh-pages
